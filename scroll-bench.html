<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/favicon.svg" />
<title>長卷軸動畫 · 手機順滑度實測</title>
<style>
  :root{ --bg:#141212; --panel:#1e1b1a; --line:#332e2c; --ink:#F3EEE8; --sub:#9c938c;
    --orange:#FF5A2D; --good:#39d98a; --warn:#ffc24b; --bad:#ff5a4d; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* 固定畫布：實際 scrub 的畫面（跟正式頁一樣 canvas drawImage） */
  #stage{position:fixed;inset:0;z-index:0;background:#0d0b0b}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* 卷軸軌道：撐高度讓手指真的能滑 */
  #track{position:relative;z-index:1}
  /* 控制＋讀數面板 */
  .hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0)) 10px 10px;
    background:linear-gradient(#141212ee,#141212cc 70%,transparent);backdrop-filter:blur(4px)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--sub);font:700 12.5px/1 var(--mono);
    padding:7px 11px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--orange);color:#fff}
  .lbl{font:700 11px/1 var(--mono);color:var(--sub);letter-spacing:.05em;margin-right:2px}
  .run{margin-left:auto;border:0;background:linear-gradient(120deg,#FF5A2D,#E8552F);color:#fff;
    font:800 13px/1 "Noto Sans TC";padding:9px 15px;border-radius:999px;cursor:pointer}
  .readout{position:fixed;z-index:5;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0));
    background:var(--panel)ee;border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(6px)}
  .fps{display:flex;align-items:baseline;gap:8px}
  .fps b{font:800 46px/1 var(--mono)} .fps span{font:700 13px/1 var(--mono);color:var(--sub)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 12px;margin-top:10px}
  .m{font:700 11px/1.3 var(--mono);color:var(--sub)} .m b{display:block;font-size:16px;color:var(--ink);margin-top:3px}
  .verdict{margin-top:11px;font:800 13.5px/1.45 "Noto Sans TC";padding:9px 12px;border-radius:10px}
  .status{font:600 11.5px/1.4 var(--mono);color:var(--sub);margin-top:8px;min-height:16px}
  .hint{position:fixed;z-index:5;left:0;right:0;top:96px;text-align:center;font:600 12px/1 "Noto Sans TC";color:var(--sub);pointer-events:none}
/* 鍵盤 focus 樣式：米白 ring 在深底與橙底上都清楚可見 */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #FBF6EE;outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="track"></div>

<div class="hud">
  <div class="row">
    <span class="lbl">解析度</span>
    <div class="seg" id="segRes">
      <button data-r="720">720</button>
      <button data-r="1080" class="on">1080</button>
      <button data-r="1440">1440</button>
      <button data-r="2160">2160·4K</button>
    </div>
    <button class="run" id="runBtn">跑 5 秒實測</button>
  </div>
  <div class="row">
    <span class="lbl">解碼法</span>
    <div class="seg" id="segTech">
      <button data-t="img">HTMLImage（現行）</button>
      <button data-t="bmp" class="on">ImageBitmap（預解碼）</button>
    </div>
  </div>
</div>

<div class="hint" id="hint">手指上下滑 → 看畫面順不順；或按「跑 5 秒實測」看分數</div>

<div class="readout">
  <div class="fps"><b id="fpsNum">–</b><span id="fpsMax"></span></div>
  <div class="grid">
    <div class="m">繪製/幀<b id="mDraw">–</b></div>
    <div class="m">最卡幀<b id="mWorst">–</b></div>
    <div class="m">掉幀率<b id="mDrop">–</b></div>
    <div class="m">解碼總時<b id="mDecode">–</b></div>
    <div class="m">記憶體估<b id="mMem">–</b></div>
    <div class="m">DPR<b id="mDpr">–</b></div>
  </div>
  <div class="verdict" id="verdict" style="background:#2a2523;color:var(--sub)">選解析度與解碼法，按「跑 5 秒實測」。分數越接近螢幕更新率越順。</div>
  <div class="status" id="status"></div>
</div>

<script>
(function(){
  var N = 20, cur = { res:'1080', tech:'bmp' };
  var frames = [];            // 目前配置的幀（Image 或 ImageBitmap）
  var loadedKey = '';         // 已載入的 "res:tech"
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d', { alpha:false, desynchronized:true });
  var dpr = Math.min(window.devicePixelRatio||1, 3);
  var track = document.getElementById('track');
  var pad3 = function(n){ return ('00'+n).slice(-3); };
  var $ = function(id){ return document.getElementById(id); };

  // 螢幕更新率偵測（60 或 120 ProMotion）
  var refreshHz = 60, rafSamples = [], baseTimer = null;
  function detectHz(){
    var last = performance.now(), n = 0;
    (function tick(t){
      var d = t - last; last = t;
      if (n>2 && d>2 && d<40) rafSamples.push(d);
      if (++n < 40) requestAnimationFrame(tick);
      else { rafSamples.sort(function(a,b){return a-b}); var med = rafSamples[rafSamples.length>>1]||16.7;
        refreshHz = med < 12 ? 120 : 60; $('fpsMax').textContent = '/ '+refreshHz+'Hz 上限'; }
    })(last);
  }

  function sizeCanvas(){
    var w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    $('mDpr').textContent = dpr.toFixed(1)+' ('+cv.width+'×'+cv.height+')';
  }
  function draw(idx){
    var im = frames[idx]; if (!im) return 0;
    var cw = cv.width/dpr, ch = cv.height/dpr;
    var iw = im.width||im.naturalWidth, ih = im.height||im.naturalHeight;
    var scale = Math.max(cw/iw, ch/ih), dw = iw*scale, dh = ih*scale;
    var dx = (cw-dw)/2, dy = (ch-dh)/2;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var t0 = performance.now();
    ctx.drawImage(im, dx, dy, dw, dh);
    return performance.now()-t0;
  }

  // 載入目前配置的 20 幀（img 或 預解碼 bitmap），回報解碼耗時
  function load(cb){
    var key = cur.res+':'+cur.tech;
    if (key === loadedKey) { cb(0); return; }
    // 釋放舊 bitmap
    frames.forEach(function(f){ if (f && f.close) f.close(); });
    frames = new Array(N);
    var base = 'assets/scroll/bench/'+cur.res+'/', done = 0, decodeTotal = 0, t0 = performance.now();
    $('status').textContent = '載入 '+cur.res+' × '+cur.tech+' …';
    for (var i=0;i<N;i++){ (function(i){
      fetch(base+pad3(i+1)+'.webp').then(function(r){ return r.blob(); }).then(function(blob){
        if (cur.tech === 'bmp'){
          var d0 = performance.now();
          return createImageBitmap(blob).then(function(bm){ decodeTotal += performance.now()-d0; frames[i]=bm; });
        } else {
          return new Promise(function(res){ var im=new Image();
            im.onload=function(){ frames[i]=im; res(); }; im.onerror=res; im.src=URL.createObjectURL(blob); });
        }
      }).then(function(){ if (++done===N){ loadedKey=key;
        var wall=(performance.now()-t0);
        $('mDecode').textContent = (cur.tech==='bmp'? Math.round(decodeTotal):Math.round(wall))+' ms';
        // 記憶體估：decoded = 寬×高×4。單段 20 幀；正式頁滑動窗口常駐約 3 段 → ×3 才是真實佔用。
        var px = parseInt(cur.res,10); var seg = (px*px*4*N)/1048576; var win = seg*3;
        $('mMem').textContent = Math.round(win)+' MB';
        $('mMem').title = '單段 '+Math.round(seg)+'MB × 3 段窗口';
        $('status').textContent = '就緒：'+cur.res+' × '+(cur.tech==='bmp'?'ImageBitmap':'HTMLImage');
        cb(decodeTotal); } });
    })(i); }
  }

  // 5 秒自動 scrub 實測（三角波來回掃 20 幀，模擬手指來回滑）
  var running = false;
  function runBench(){
    if (running) return;
    load(function(){
      running = true; $('runBtn').textContent = '實測中…';
      var start = performance.now(), last = start, frameTimes = [], drawTimes = [], count = 0;
      var dur = 5000;
      (function loop(t){
        var dt = t - last; last = t;
        if (t - start > 300) { frameTimes.push(dt); count++; } // 前 0.3s 暖機不計
        // 三角波 0→1→0…每 1.4s 一趟
        var prog = ((t-start)/1400) % 2; if (prog>1) prog = 2-prog;
        var idx = Math.min(N-1, Math.floor(prog*(N-1)+0.5));
        drawTimes.push(draw(idx));
        // 即時 FPS（近 30 幀）
        if (count%8===0 && frameTimes.length>10){
          var recent = frameTimes.slice(-30), avg = recent.reduce(function(a,b){return a+b},0)/recent.length;
          $('fpsNum').textContent = Math.round(1000/avg);
        }
        if (t - start < dur) requestAnimationFrame(loop);
        else finish(frameTimes, drawTimes);
      })(start);
    });
  }
  function finish(ft, dt){
    running = false; $('runBtn').textContent = '再跑一次';
    ft.sort(function(a,b){return a-b});
    var avg = ft.reduce(function(a,b){return a+b},0)/ft.length;
    var fps = Math.round(1000/avg);
    var worst = ft[ft.length-1];
    var budget = 1000/refreshHz;
    var dropped = ft.filter(function(x){ return x > budget*1.5; }).length;
    var dropPct = Math.round(dropped/ft.length*100);
    var avgDraw = dt.reduce(function(a,b){return a+b},0)/dt.length;
    $('fpsNum').textContent = fps;
    $('mDraw').textContent = avgDraw.toFixed(2)+' ms';
    $('mWorst').textContent = Math.round(worst)+' ms';
    $('mDrop').textContent = dropPct+' %';
    // 記憶體才是手機真正天花板：3 段窗口 decoded 佔用
    var px = parseInt(cur.res,10); var winMB = Math.round((px*px*4*N)/1048576*3);
    var v = $('verdict'), pct = fps/refreshHz;
    var smooth = pct >= 0.95 && dropPct <= 2;
    var okish = pct >= 0.8 && dropPct <= 8;
    if (winMB > 800){ v.style.background='#301514'; v.style.color='#ff7a6d';
      v.textContent='❌ 記憶體爆量（'+winMB+'MB／3 段窗口）——即使繪製順，iOS 很可能直接殺分頁重載。'+cur.res+' 手機不可用（螢幕也顯示不出這麼多像素）。'; }
    else if (smooth && winMB <= 450){ v.style.background='#12301f'; v.style.color='#39d98a';
      v.textContent='✅ 順又穩（'+fps+'fps，記憶體 '+winMB+'MB）——'+cur.res+' 在這支手機撐得住，可安心用這清晰度。'; }
    else if (okish || winMB <= 700){ v.style.background='#2f2810'; v.style.color='#ffc24b';
      v.textContent='⚠️ 邊緣（'+fps+'fps，'+dropPct+'% 掉幀，記憶體 '+winMB+'MB）——'+cur.res+' 快滑或舊機會頓/被回收，建議降一級保險。'; }
    else { v.style.background='#301514'; v.style.color='#ff7a6d';
      v.textContent='❌ 太重（'+fps+'fps，'+dropPct+'% 掉幀，'+winMB+'MB）——'+cur.res+' 對這支手機負擔太大。'; }
  }

  // 手動滑動也即時 scrub（讓人「感覺」順不順）
  var manualRAF = false;
  function onScroll(){
    if (running || manualRAF) return; manualRAF = true;
    requestAnimationFrame(function(){
      var max = track.offsetHeight - window.innerHeight;
      var p = max>0 ? Math.min(1, Math.max(0, window.scrollY/max)) : 0;
      draw(Math.min(N-1, Math.floor(p*(N-1)+0.5))); manualRAF = false;
    });
  }

  // 綁定控制
  function bind(segId, key, apply){
    document.getElementById(segId).addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      [].forEach.call(this.children, function(c){ c.classList.remove('on'); }); b.classList.add('on');
      apply(b); if (!running) load(function(){ draw(0); });
    });
  }
  bind('segRes','res', function(b){ cur.res = b.dataset.r; });
  bind('segTech','tech', function(b){ cur.tech = b.dataset.t; });
  $('runBtn').addEventListener('click', runBench);

  function layout(){ dpr = Math.min(window.devicePixelRatio||1, 3); sizeCanvas();
    track.style.height = (window.innerHeight*8)+'px'; draw(0); }
  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', layout);
  detectHz(); layout();
  load(function(){ draw(0); setTimeout(runBench, 400); });  // 進頁自動先跑一次 1080 預設
})();
</script>
</body>
</html>
