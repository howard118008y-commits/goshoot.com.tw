<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>飛進 Go Shoot 世界｜中和戰鬥陀螺・一番賞・娃娃機</title>
  <meta name="description" content="滾動飛進 Go Shoot 的世界——從中和店門口一路飛進娃娃機牆、一番賞牆到線上開抽。" />
  <link rel="icon" href="assets/favicon.svg" />
  <style>
    /* ---- Go Shoot theme（VI v2：動感橘 × 炫酷黑）----
       引擎預設包在 @layer sw，這裡的無層 token 必勝。 */
    :root, .sw-root {
      --sw-bg: #1A1A1A;         /* 炫酷黑 */
      --sw-ink: #F7F3ED;        /* 米白主文字 */
      --sw-ink-soft: #A8A29B;   /* 次要字 */
      --sw-accent: #FF5A2D;     /* 動感橘 */
      --sw-font-display: "Poppins", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      --sw-font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    body { margin: 0; background: #1A1A1A; }

    /* 深色主題覆蓋（引擎預設假設淺色頁） */
    .sw-root .sw-nav { background: color-mix(in srgb, #000 46%, transparent); border-color: color-mix(in srgb, var(--sw-accent) 28%, transparent); }
    .sw-root .sw-nav__item { color: color-mix(in srgb, var(--sw-ink) 62%, transparent); }
    .sw-root .sw-nav__item:hover { color: var(--sw-ink); }
    .sw-root .sw-nav__item.is-active { color: #1A1A1A; background: var(--sw-accent); }
    .sw-root .sw-topcta { color: #fff; background: linear-gradient(135deg, #FF5A2D, #E24A2C); font-weight: 800; letter-spacing: .02em; }
    .sw-root .sw-topcta:hover { filter: brightness(1.1); }
    .sw-root .sw-btn--primary { color: #fff; background: linear-gradient(135deg, #FF5A2D, #E24A2C); box-shadow: 0 12px 30px rgba(255,90,45,.35); font-weight: 800; letter-spacing: .02em; }
    .sw-root .sw-btn--primary:hover { filter: brightness(1.1); }
    .sw-root .sw-btn--ghost { color: var(--sw-ink); border-color: color-mix(in srgb, var(--sw-ink) 40%, transparent); }
    .sw-root .sw-btn--ghost:hover { border-color: var(--sw-accent); color: var(--sw-accent); }
    .sw-root .sw-copy__tags li { color: #FFB59E; background: rgba(255,90,45,.12); border-color: rgba(255,90,45,.34); }
    .sw-root .sw-route__label { background: color-mix(in srgb, #1A1A1A 84%, transparent); color: var(--sw-ink); border-color: rgba(255,90,45,.22); }
    .sw-root .sw-copy__eyebrow { letter-spacing: .24em; font-weight: 800; }
    .sw-root .sw-copy__title { font-weight: 900; letter-spacing: .01em; line-height: 1.12; }
    .sw-root .sw-brand__name { font-weight: 900; letter-spacing: .12em; }
    /* 粒子換品牌橘（引擎 dot/ring 預設吃 accent，這裡加一點金色變化） */
    .sw-root .sw-pt--ring { border-color: #FFC24B; }

    /* 手機滿版：poster placeholder 也用 cover 鋪滿（canvas 已 cover），避免載入前後跳變 */
    @media (max-width: 768px) {
      .sw-root .sw-scene__still { object-fit: cover !important; }
    }

    /* ===== 著陸段：滾到最底，世界拉遠後浮現 GO SHOOT 主頁入口 ===== */
    #gs-landing { position: fixed; inset: 0; z-index: 5000; opacity: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
      padding: 24px; text-align: center;
      background: radial-gradient(120% 90% at 50% 40%, rgba(18,14,12,.975), #0f0e0d 60%);
      transition: opacity .45s ease; }
    #gs-landing.on { pointer-events: auto; }
    #gs-landing img { width: min(76vw, 500px); height: auto;
      filter: drop-shadow(0 0 60px rgba(255,90,45,.45)); transform: translateY(14px) scale(.96);
      transition: transform .6s cubic-bezier(.2,.8,.2,1); }
    #gs-landing.on img { transform: translateY(0) scale(1); }
    #gs-landing .gs-land-sub { color: #A8A29B; font-size: 14.5px; letter-spacing: .04em; margin: -8px 0 0; }
    #gs-landing .gs-land-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    #gs-landing a { text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 999px;
      padding: 15px 30px; transition: filter .15s, transform .15s; }
    #gs-landing a.gs-enter { color: #fff; background: linear-gradient(135deg, #FF5A2D, #E24A2C);
      box-shadow: 0 14px 36px rgba(255,90,45,.4); }
    #gs-landing a.gs-draw { color: #F7F3ED; border: 1px solid rgba(247,243,237,.4); background: rgba(0,0,0,.35); }
    #gs-landing a:hover { filter: brightness(1.1); transform: translateY(-2px); }
    #gs-landing a:focus-visible { outline: 2px solid #FFC24B; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { #gs-landing, #gs-landing img { transition: none; } }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <!-- 開場模式（?intro=1 從首頁導入）：右上跳過 → 直接進官網首頁 -->
  <a id="gsSkipIntro" href="index.html" hidden
     style="position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:9000;
     font:800 13px/1 'Noto Sans TC',sans-serif;color:#F7F3ED;background:rgba(0,0,0,.5);text-decoration:none;
     border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:9px 16px;
     backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)">跳過開場 ✕</a>

  <!-- 著陸段：滾到最底浮現品牌入口 -->
  <div id="gs-landing" aria-hidden="true">
    <img src="assets/brand/logo-main-dark.jpg" alt="Go Shoot" />
    <p class="gs-land-sub">3・2・1，Go Shoot！ 準備好進入了嗎？</p>
    <div class="gs-land-btns">
      <a class="gs-enter" id="gsEnterHome" href="index.html">進入官網首頁 →</a>
      <a class="gs-draw" href="https://goshoot-ichiban.vercel.app/draw" target="_top">立即線上開抽</a>
    </div>
  </div>

  <!-- scrub engine：oso95/scroll-world（MIT）references/scrub-engine.js -->
  <script src="assets/scroll/scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'GO SHOOT', href: '#top' },
      cta: { label: '立即開抽', href: 'https://goshoot-ichiban.vercel.app/draw' },
      hint: '往下滑，飛進店裡',
      diveScroll: 1.25, connScroll: 0.9,
      frames: { base: 'assets/scroll/frames/', count: 20 },   // iOS 可靠：逐幀換 img.src（取代 video scrub）
      sections: [
        { id: 'street', label: '店門口', still: 'assets/scroll/scene-street.webp', clip: 'assets/scroll/vid/dive1.mp4', accent: '#FF5A2D',
          eyebrow: '新北・中和｜景平路 593 號', title: '半夜十二點，店門是開的。',
          body: '捷運站旁、24 小時無人娃娃機店——景平路上最亮的一間。',
          tags: ['24H 無人店', '中和捷運站旁'] },
        { id: 'claw', label: '娃娃機牆', still: 'assets/scroll/scene-claw.webp', clip: 'assets/scroll/vid/dive2.mp4', accent: '#FF5A2D',
          eyebrow: '第一站', title: '整排機台，等你出手。',
          body: '韓系燈牆與滿滿的獎品，投幣聲就是這裡的開場音樂。',
          tags: ['韓系燈牆', '天天補貨'] },
        { id: 'ichiban', label: '一番賞牆', still: 'assets/scroll/scene-ichiban.webp', clip: 'assets/scroll/vid/dive3.mp4', accent: '#FF5A2D',
          eyebrow: '鎮店主打', title: '每一抽，都有獎。',
          body: '戰鬥陀螺 × 寶可夢卡牌 × 皮克敏——每抽必中，絕不槓龜。',
          tags: ['每抽必中', '三大 IP'] },
        { id: 'online', label: '線上開抽', still: 'assets/scroll/scene-online.webp', clip: 'assets/scroll/vid/dive4.mp4', accent: '#FF5A2D',
          eyebrow: '不想出門？', title: '手機就是抽獎機。',
          body: '線上一番賞 24H 開抽，公開亂數可驗證，中獎宅配到府。',
          tags: ['24H 線上抽', '公開可驗證'] },
        { id: 'prize', label: '大賞時刻', still: 'assets/scroll/scene-prize.webp', clip: 'assets/scroll/vid/dive5.mp4', accent: '#FF5A2D',
          eyebrow: '開箱瞬間', title: '搶不到的，在這裡抽到。',
          body: '超商搶破頭的限定機，在這裡是 S 賞——抽到直接帶回家。',
          tags: ['限定大賞', '宅配到府'] },
        { id: 'world', label: '3・2・1', still: 'assets/scroll/scene-world.webp', clip: 'assets/scroll/vid/dive6.mp4', accent: '#FF5A2D',
          eyebrow: '3・2・1', title: 'Go Shoot！',
          body: '線上開抽，或來店裡玩一場——我們 24 小時都在。',
          cta: { primary: { label: '立即開抽 →', href: 'https://goshoot-ichiban.vercel.app/draw' },
                 secondary: { label: '查看門市位置', href: 'store.html' } } },
      ],
      connectors: ['assets/scroll/vid/conn1.mp4','assets/scroll/vid/conn2.mp4','assets/scroll/vid/conn3.mp4','assets/scroll/vid/conn4.mp4','assets/scroll/vid/conn5.mp4'],
    });

    // 著陸段：滾動進度 >92% 時淡入 GO SHOOT 主頁入口（最後一幕拉遠後接品牌畫面）
    (function () {
      var land = document.getElementById('gs-landing');
      var START = 0.92, ticking = false;
      function update() {
        ticking = false;
        var max = document.documentElement.scrollHeight - window.innerHeight;
        var p = max > 0 ? window.scrollY / max : 0;
        var op = Math.max(0, Math.min(1, (p - START) / (1 - START)));
        land.style.opacity = op;
        land.classList.toggle('on', op > 0.5);
        land.setAttribute('aria-hidden', op > 0.5 ? 'false' : 'true');
      }
      window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    // 開場模式（首頁導入 ?intro=1）：顯示「跳過開場」入口，隨時可直接進首頁
    (function () {
      if (!/[?&]intro=1\b/.test(location.search)) return;
      var skip = document.getElementById('gsSkipIntro');
      if (skip) skip.hidden = false;
    })();
  </script>
</body>
</html>
