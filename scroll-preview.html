<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Go Shoot 滾動世界（內部預覽）｜飛進中和最好玩的一間店</title>
  <meta name="description" content="滾動式官網改版內部預覽——scroll 飛進 Go Shoot 的世界。" />
  <link rel="icon" href="assets/favicon.svg" />
  <style>
    /* ---- Go Shoot theme（VI v2：動感橘 × 炫酷黑）----
       引擎預設包在 @layer sw，這裡的無層 token 必勝。 */
    :root, .sw-root {
      --sw-bg: #1A1A1A;         /* 炫酷黑 */
      --sw-ink: #F7F3ED;        /* 米白主文字 */
      --sw-ink-soft: #A8A29B;   /* 次要字 */
      --sw-accent: #FF5A2D;     /* 動感橘 */
      --sw-font-display: "Poppins", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      --sw-font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    body { margin: 0; background: #1A1A1A; }

    /* 深色主題覆蓋（引擎預設假設淺色頁） */
    .sw-root .sw-nav { background: color-mix(in srgb, #000 46%, transparent); border-color: color-mix(in srgb, var(--sw-accent) 28%, transparent); }
    .sw-root .sw-nav__item { color: color-mix(in srgb, var(--sw-ink) 62%, transparent); }
    .sw-root .sw-nav__item:hover { color: var(--sw-ink); }
    .sw-root .sw-nav__item.is-active { color: #1A1A1A; background: var(--sw-accent); }
    .sw-root .sw-topcta { color: #fff; background: linear-gradient(135deg, #FF5A2D, #E24A2C); font-weight: 800; letter-spacing: .02em; }
    .sw-root .sw-topcta:hover { filter: brightness(1.1); }
    .sw-root .sw-btn--primary { color: #fff; background: linear-gradient(135deg, #FF5A2D, #E24A2C); box-shadow: 0 12px 30px rgba(255,90,45,.35); font-weight: 800; letter-spacing: .02em; }
    .sw-root .sw-btn--primary:hover { filter: brightness(1.1); }
    .sw-root .sw-btn--ghost { color: var(--sw-ink); border-color: color-mix(in srgb, var(--sw-ink) 40%, transparent); }
    .sw-root .sw-btn--ghost:hover { border-color: var(--sw-accent); color: var(--sw-accent); }
    .sw-root .sw-copy__tags li { color: #FFB59E; background: rgba(255,90,45,.12); border-color: rgba(255,90,45,.34); }
    .sw-root .sw-route__label { background: color-mix(in srgb, #1A1A1A 84%, transparent); color: var(--sw-ink); border-color: rgba(255,90,45,.22); }
    .sw-root .sw-copy__eyebrow { letter-spacing: .24em; font-weight: 800; }
    .sw-root .sw-copy__title { font-weight: 900; letter-spacing: .01em; line-height: 1.12; }
    .sw-root .sw-brand__name { font-weight: 900; letter-spacing: .12em; }
    /* 粒子換品牌橘（引擎 dot/ring 預設吃 accent，這裡加一點金色變化） */
    .sw-root .sw-pt--ring { border-color: #FFC24B; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <!-- scrub engine：oso95/scroll-world（MIT）references/scrub-engine.js -->
  <script src="assets/scroll/scrub-engine.js"></script>

                 secondary: { label: '查看門市位置', href: 'store.html' } } },
      ],
      connectors: [null, null, null, null, null],
    });
  </script>
</body>
</html>
