name: Weekly SEO content bot

on:
  schedule:
    - cron: '0 6 * * 5'       # UTC：週五 06:00 = 台灣 14:00。2026-08-23 老闆指示由週二/五/日三次減為一週一次（Claude API 費用）；週五出文，避開週一 02:00 的新聞卡
  workflow_dispatch: {}         # 手動觸發（測試用）

permissions:
  contents: write

jobs:
  write-article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 安裝 Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: 產出文章（Claude）
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 2026-08-23 由 claude-opus-4-8 降階成 sonnet-5（老闆指示：Claude API 費用）
          claude -p "$(cat .github/seo-content-prompt.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions

      - name: 補齊 sitemap（Claude 漏改也擋得住）
        run: python3 .github/ensure_sitemap.py

      - name: 提交變更（指名檔案＋rebase 防撞車）
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add article-*.html sitemap.xml ichiban-beyblade.html llms.txt store.html content-queue.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "沒有變更，跳過 commit（可能今天沒選到新題）"
          else
            git commit -m "content(seo): 每週自動新增 SEO 文章 $(date +%F)"
            git fetch origin
            git rebase origin/main
            git push
          fi
