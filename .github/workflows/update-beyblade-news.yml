name: Update Beyblade news

# 每週自動更新首頁「戰鬥陀螺情報」4 張新聞卡：
# 找最新 Beyblade X 新聞 → 下載每篇 og:image 當封面 → 更新卡片 → commit+push。
# 由 Claude（Sonnet）在雲端執行，不需要本機 Mac。
on:
  schedule:
    - cron: '0 2 * * 1,4'      # 每週一、四 02:00 UTC（台灣 10:00）
  workflow_dispatch: {}         # 也可在 Actions 頁面手動觸發（測試用）

permissions:
  contents: write               # 允許把更新後的檔案 commit 回 repo

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝工具（Claude CLI + ImageMagick）
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: 執行新聞更新（Claude）
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/beyblade-news-prompt.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions

      - name: 同步手機版新聞卡（確定性步驟，勿刪）
        run: |
          python3 .github/sync_mobile_news.py
          python3 .github/sync_mobile_news.py --check

      - name: Commit 更新
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add index.html assets/news SOCIAL-DRAFTS.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "沒有變更（可能新聞沒更新或執行失敗），跳過 commit"
          else
            git commit -m "content(home): 自動更新戰鬥陀螺情報新聞卡 $(date +%F)"
            git push
          fi
