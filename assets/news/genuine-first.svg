<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Go Shoot 只賣正版 Beyblade X 戰鬥陀螺，拒絕盜版">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141018"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FF6A4D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6A4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8366"/>
      <stop offset="1" stop-color="#FF6A4D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- 盾牌 + 勾 -->
  <g transform="translate(180 250)">
    <path d="M0 -132 L112 -92 V6 C112 84 60 132 0 156 C-60 132 -112 84 -112 6 V-92 Z" fill="url(#shield)"/>
    <path d="M0 -132 L112 -92 V6 C112 84 60 132 0 156 C-60 132 -112 84 -112 6 V-92 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <path d="M-46 6 L-12 42 L54 -40" fill="none" stroke="#0B0B0D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-46 6 L-12 42 L54 -40" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 文字 -->
  <g font-family="'Noto Sans TC','PingFang TC','Helvetica Neue',sans-serif">
    <text x="360" y="150" fill="#ECECEA" font-size="72" font-weight="900" letter-spacing="2">只賣正版</text>
    <text x="360" y="214" fill="#B6F500" font-size="34" font-weight="800">拒絕盜版陀螺</text>
    <rect x="360" y="248" width="360" height="2" fill="#ffffff" opacity="0.14"/>
    <text x="360" y="300" fill="#B4B4BB" font-size="26" font-weight="500">正版 Beyblade X（TAKARA TOMY）</text>
    <text x="360" y="344" fill="#B4B4BB" font-size="26" font-weight="500">認明 ST 安全玩具標誌</text>
    <text x="360" y="420" fill="#FF8366" font-size="26" font-weight="800" font-family="'Poppins','Noto Sans TC',sans-serif">GO SHOOT・戰鬥陀螺專門店</text>
  </g>
</svg>
